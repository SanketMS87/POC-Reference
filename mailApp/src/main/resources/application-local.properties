# =============================================================================
# Local development (profile "local"): java -jar mail.jar --spring.profiles.active=local
# or mvn spring-boot:run -Dspring-boot.run.profiles=local
#
# Security is permit-all, no logstash appender and Azure Key Vault is off.
# Override any value with an environment variable or a command-line argument.
# Do not commit real secrets here.
# =============================================================================
app.environment=LOCAL
app.default-schema=cwf

app.datasource.cwf.url=${DB_CWF_URL:jdbc:postgresql://localhost:5432/cwf}

app.mail.host=localhost
app.mail.port=25
app.mail.smtp.auth=false
app.mail.smtp.starttls=false
app.mail.smtp.ssl-trust=
app.mail.sender-address=local-noreply@swissre.com

app.urls.deal=http://localhost:8081/deal
app.urls.deal-app=http://localhost:8081/dealApp
app.urls.renewal-overview=http://localhost:8081/renewalOverview/
app.urls.pom=http://localhost:8081/pom

app.oauth2.swisscom-client=${swisscom-oauth-client:${SWISSCOM_OAUTH_CLIENT:local-client-id}}
app.oauth2.swisscom-secret=${swisscom-oauth-secret:${SWISSCOM_OAUTH_SECRET:local-client-secret}}
app.oauth2.uwb-scope=api://local-uwb/.default
app.oauth2.pom-scope=api://local-pom/.default

app.security.jwt.audiences=local-audience
