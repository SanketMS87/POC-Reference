# =============================================================================
# Common configuration: embedded Tomcat (Spring Boot uber jar), PostgreSQL,
# typed @ConfigurationProperties (AppProperties / SecurityProperties) and
# Azure Key Vault for secrets.
#
# Environment-specific values live in application-<profile>.properties
# (train1, train2, train3, prod, local). Select one with
#   java -jar mail.jar --spring.profiles.active=train1
# or SPRING_PROFILES_ACTIVE=train1.
#
# Secrets: each secret is read from an Azure Key Vault secret when Key Vault is
# enabled (AZURE_KEYVAULT_ENABLED=true) and from the environment variable shown
# otherwise. Key Vault secret names (dashes only) used below:
#   cwf-db-username          (env DB_CWF_USER)
#   cwf-db-password          (env DB_CWF_PASSWORD)
#   mail-tech-user           (env MAIL_TECH_USER)
#   mail-tech-pass           (env MAIL_TECH_PASS)
#   swisscom-oauth-client    (env SWISSCOM_OAUTH_CLIENT)
#   swisscom-oauth-secret    (env SWISSCOM_OAUTH_SECRET)
# =============================================================================

# Use the safe standalone configuration when no deployment profile is selected.
# Explicit train1, train2, train3, and prod profiles continue to override this.
spring.profiles.default=local

# ---- Embedded Tomcat ---------------------------------------------------------
server.port=${PORT:9080}
server.servlet.context-path=/mail
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,application/javascript

# ---- Logging (logstash TCP appender is used for every profile except local) --
logging.url=${LOGSTASH_URL:localhost:5000}

# ---- Outbound OAuth2 token endpoint -----------------------------------------
token-issuer=https://login.microsoftonline.com/45597f60-6e37-4be7-acfb-4c9e23b261ea/oauth2/v2.0/token

# ---- Azure Key Vault (replaces the Vault CF service bindings) ----------------
# Authentication uses DefaultAzureCredential: managed identity in Azure,
# AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_CLIENT_SECRET or the Azure CLI locally.
# NOTE: Spring Boot does not merge list elements across property files, so every
# property-sources[0].* entry must live in this file; profiles only set
# app.keyvault.default-enabled. The identity needs get + list permission on secrets.
app.keyvault.default-enabled=false
spring.cloud.azure.keyvault.secret.property-source-enabled=${AZURE_KEYVAULT_ENABLED:${app.keyvault.default-enabled}}
spring.cloud.azure.keyvault.secret.property-sources[0].name=mail-keyvault
spring.cloud.azure.keyvault.secret.property-sources[0].enabled=${AZURE_KEYVAULT_ENABLED:${app.keyvault.default-enabled}}
spring.cloud.azure.keyvault.secret.property-sources[0].endpoint=${AZURE_KEYVAULT_ENDPOINT:}

# ---- app.* (bound to AppProperties) -----------------------------------------
app.default-schema=cwf

# PostgreSQL cwf datasource (Hikari pool). app.datasource.cwf.url is profile specific.
app.datasource.cwf.driver-class-name=org.postgresql.Driver
app.datasource.cwf.username=${cwf-db-username:${DB_CWF_USER:cwf}}
app.datasource.cwf.password=${cwf-db-password:${DB_CWF_PASSWORD:}}
app.datasource.cwf.pool.min-idle=1
app.datasource.cwf.pool.max-size=50
app.datasource.cwf.pool.connection-timeout-ms=180000
app.datasource.cwf.pool.validation-timeout-ms=30000
app.datasource.cwf.pool.idle-timeout-ms=1200000
app.datasource.cwf.pool.max-lifetime-ms=1800000

# SMTP relay
app.mail.host=exmailrelay.int.swissre.com
app.mail.port=25
app.mail.smtp.auth=true
app.mail.smtp.starttls=true
app.mail.smtp.ssl-trust=exmailrelay.int.swissre.com
app.mail.sender-address=noreply_UWBench@swissre.com
app.mail.tech-user=${mail-tech-user:${MAIL_TECH_USER:}}
app.mail.tech-pass=${mail-tech-pass:${MAIL_TECH_PASS:}}

# Outbound OAuth2 client credentials / scopes.
# app.oauth2.uwb-scope and app.oauth2.pom-scope are profile specific.
app.oauth2.swisscom-client=${swisscom-oauth-client:${SWISSCOM_OAUTH_CLIENT:}}
app.oauth2.swisscom-secret=${swisscom-oauth-secret:${SWISSCOM_OAUTH_SECRET:}}
app.oauth2.graph-scope=https://graph.microsoft.com/.default

# ---- app.security.* (bound to SecurityProperties) ---------------------------
# Inbound bearer-token (JWT) validation for the embedded Tomcat runtime.
# app.security.jwt.audiences is profile specific (comma separated).
app.security.jwt.jwk-set-uri=https://login.microsoftonline.com/45597f60-6e37-4be7-acfb-4c9e23b261ea/discovery/v2.0/keys
app.security.jwt.issuer=https://login.microsoftonline.com/45597f60-6e37-4be7-acfb-4c9e23b261ea/v2.0
app.security.jwt.user-name-claim=sub
app.security.jwt.roles-claim=roles
# true: every valid token gets all known roles.
# false: only roles from the token's roles claim are granted.
app.security.grant-all-roles-to-authenticated=false

# ---- Springdoc / Swagger UI --------------------------------------------------
# Restrict scanning to business controllers only so Spring Boot internals
# (BasicErrorController, actuator, etc.) do not appear in the API docs.
springdoc.packages-to-scan=com.rukamini.mail.controller
# Sort controller groups (tags) and their operations alphabetically in the UI.
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
# Do not redirect the root swagger-ui URL to the default Petstore example.
springdoc.swagger-ui.disable-swagger-default-url=true
