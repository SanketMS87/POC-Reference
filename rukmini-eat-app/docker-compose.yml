services:
  postgres:
    image: postgres:16
    container_name: rukmini-eat-db
    environment:
      POSTGRES_DB: rukmini_eat
      POSTGRES_USER: rukmini
      POSTGRES_PASSWORD: rukmini
    ports:
      - "5432:5432"
    volumes:
      - rukmini-eat-data:/var/lib/postgresql/data

volumes:
  rukmini-eat-data:
