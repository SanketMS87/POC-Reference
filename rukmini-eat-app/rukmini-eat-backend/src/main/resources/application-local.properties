spring.datasource.url=jdbc:h2:mem:rukmini;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# Development conveniences, enabled only with the "local" profile.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Public development key. The application refuses to start with this value outside the "local" profile.
app.jwt.secret=dev-only-secret-change-me-0123456789abcdef
