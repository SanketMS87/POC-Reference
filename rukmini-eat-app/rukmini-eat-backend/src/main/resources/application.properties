server.servlet.context-path=/rukmini-eat
spring.application.name=rukmini-eat
server.port=8080

# In-memory H2 by default. For a real database, add its JDBC driver and set DB_URL/DB_USERNAME/DB_PASSWORD
# (and spring.datasource.driver-class-name / spring.jpa.database-platform if they cannot be inferred).
spring.datasource.url=${DB_URL:jdbc:h2:mem:rukmini;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Development tools are off unless the "local" profile enables them.
spring.h2.console.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# HS256 secret, minimum 32 bytes, required outside the "local" profile (set JWT_SECRET).
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl-minutes=60

app.cors.allowed-origins=http://localhost:4200

# Login/register throttling per client address and endpoint. Set max-attempts=0 to disable.
app.security.rate-limit.max-attempts=20
app.security.rate-limit.window-seconds=60

# Reserved server-side configuration. No provider adapter is active yet.
# Setting these values alone does not enable live data or real ordering.
app.providers.zomato.base-url=${ZOMATO_API_BASE_URL:}
app.providers.zomato.api-key=${ZOMATO_API_KEY:}
app.providers.swiggy.base-url=${SWIGGY_API_BASE_URL:}
app.providers.swiggy.api-key=${SWIGGY_API_KEY:}
