spring.application.name=rukmini-eat
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rukmini_eat}
spring.datasource.username=${DB_USERNAME:rukmini}
spring.datasource.password=${DB_PASSWORD:rukmini}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# HS256 secret, minimum 32 bytes. Override with the JWT_SECRET environment variable outside local dev.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.jwt.ttl-minutes=60

app.cors.allowed-origins=http://localhost:4200

# Reserved server-side configuration. No provider adapter is active yet.
# Setting these values alone does not enable live data or real ordering.
app.providers.zomato.base-url=${ZOMATO_API_BASE_URL:}
app.providers.zomato.api-key=${ZOMATO_API_KEY:}
app.providers.swiggy.base-url=${SWIGGY_API_BASE_URL:}
app.providers.swiggy.api-key=${SWIGGY_API_KEY:}
